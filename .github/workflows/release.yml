name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v1.4.0'
        required: true

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Resolve an existing version tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          readonly TAG_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          [[ "$RELEASE_TAG" =~ $TAG_PATTERN ]] || { echo 'Invalid release tag' >&2; exit 1; }
          commit="$(gh api "repos/$GH_REPO/commits/refs/tags/$RELEASE_TAG" --jq .sha)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  release:
    needs: validate
    environment: release
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - run: brew install osslsigncode komac
      - run: go test ./...
      - run: ./release.sh "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

  snap:
    needs: [validate, release]
    environment: release
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, asset: go-live-linux-x64 }
          - { runner: ubuntu-24.04-arm, asset: go-live-linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - run: sudo snap install snapcraft --classic
      - run: |
          mkdir -p snap/local
          gh release download "$RELEASE_TAG" -p "$ASSET" -O snap/local/go-live
          gh release download "$RELEASE_TAG" -p SHA256SUMS -O snap/local/SHA256SUMS
          cd snap/local
          awk -v asset="$ASSET" '$2 == asset { print $1 "  go-live" }' SHA256SUMS > selected.sha256
          [[ "$(wc -l < selected.sha256)" -eq 1 ]] || { echo 'Missing or duplicate checksum' >&2; exit 1; }
          sha256sum --check --strict selected.sha256
          rm SHA256SUMS selected.sha256
          chmod +x go-live
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ matrix.asset }}
      - run: sudo snapcraft pack --destructive-mode
      - run: snapcraft upload --release=stable go-live_*.snap
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
